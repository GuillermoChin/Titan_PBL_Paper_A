# Exact environment that produced the single source of numbers, the figures and
# the tables of the revised Paper A (v2.0.0). Versions are pinned, not ranges:
# this file is a reproducibility artifact.
#
# It mirrors the environment that produced the released files, which mixes
# conda-forge and PyPI packages: scipy comes from conda-forge (linear algebra
# with MKL), while numpy, matplotlib and the packages listed under pip come from
# their PyPI wheels (numpy with its bundled OpenBLAS, matplotlib with its
# bundled FreeType). Because conda installs numpy 2.4.6 as a dependency of
# scipy, the numpy wheel must be installed in a second step, after creating
# the environment:
#
#   conda env create -f environment.yml
#   conda activate titan_pbl_paper_A_v2
#   python -m pip install --no-deps --force-reinstall numpy==2.4.6
#
# With the conda-forge build of numpy the numbers agree to about 1e-13 in
# relative terms but are not identical bit for bit. The figures also need the
# Arial font (present on Windows; see README.md).
name: titan_pbl_paper_A_v2
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.15
  - pip
  - numpy=2.4.6
  - scipy=1.17.1
  - libblas=3.11.0=*mkl
  - mkl=2026.1.0
  - pandas=3.0.5
  - netcdf4=1.7.4
  - cftime=1.6.5
  - pyyaml=6.0.3
  - pydantic=2.13.4
  - pytest=9.1.1
  - pip:
      - matplotlib==3.11.1
      - pillow==12.3.0
      - xarray==2026.7.0
      - contourpy==1.3.3
      - cycler==0.12.1
      - fonttools==4.63.0
      - kiwisolver==1.5.0
      - packaging==26.3
      - pyparsing==3.3.2
      - python-dateutil==2.9.0.post0
      - six==1.17.0
